# Development environment for the upki-mirror Kubernetes charm.
# Packaging uses LXD containers inside the workshop VM. Image tests and
# integration tests use the separate workflows described in CONTRIBUTING.md.
name: dev
base: ubuntu@26.04
confinement: virtual-machine

sdks:
  - name: uv
  - name: project-upki-mirror-dev

actions:
  lint: |
    make lint

  format: |
    make format

  unit: |
    make unit

  pack-charm: |
    charmcraft pack --use-lxd "$@"

  pack-rock: |
    rockcraft pack --use-lxd "$@"

  # Forward pytest arguments for focused charm tests, without image/Juju tests.
  pytest: |
    PYTHONPATH=/project:/project/lib:/project/src \
      uv run --all-extras --locked pytest \
      --ignore=tests/integration --ignore=tests/image --tb native -v "$@"
