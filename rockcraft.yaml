name: upki-mirror
version: 1.0.0-beta.3
license: Apache-2.0
base: ubuntu@24.04
build-base: ubuntu@24.04
run-user: _daemon_

platforms:
  amd64:

summary: An image for fetching and serving CRLite filters using upki-mirror and nginx
description: |
  upki-mirror is a service for fetching and serving crlite filters.

  This image ships upki-mirror along with nginx, so that it can be used both for fetching
  crlite filters from the upstream, and serving them over HTTP.

services:
  nginx:
    override: replace
    startup: enabled
    command: nginx -g 'daemon off;'

parts:
  upki-mirror:
    plugin: rust
    source: https://github.com/rustls/upki.git
    source-subdir: upki-mirror
    override-pull: |
      craftctl default
      git fetch --tags
      git checkout "upki-$CRAFT_PROJECT_VERSION"
    stage:
      - bin/intermediates
      - bin/mozilla-crlite

  nginx:
    plugin: nil
    stage-packages:
      - nginx_bins
      - ca-certificates_data

  user-setup:
    plugin: nil
    after: [nginx, upki-mirror]
    override-prime: |
      craftctl default
      UPKI_UID=584792
      UPKI_GID=584792

      # Keep writable paths narrow, including those used by LogProxyConsumer.
      mkdir -p var/www/html var/log/nginx var/lib/nginx run/nginx \
        opt/promtail etc/promtail
      chown -R ${UPKI_UID}:${UPKI_GID} var/www/html var/log/nginx \
        var/lib/nginx run/nginx opt/promtail etc/promtail
      chmod -R u+rwX,g+rX,o-rwx var/www/html var/log/nginx \
        var/lib/nginx run/nginx opt/promtail etc/promtail

      # Nginx inherits the image user and stores its PID in its own directory.
      sed -i '/^user /d; s|pid /run/nginx.pid;|pid /run/nginx/nginx.pid;|' \
        etc/nginx/nginx.conf
      sed -i 's/listen 80 /listen 8080 /; s/\[::\]:80 /[::]:8080 /' \
        etc/nginx/sites-available/default
